apiVersion: apps/v1
kind:  Deployment
metadata:
  name: nginx-depl
  annotations:
    kubernetes.io/change-cause: "Upgrade NGINX to 1.25.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-pod
  template:
    metadata:
      name: nginx-pod-spec
      labels:
        app: nginx-pod
    spec:
      containers:
      - name: nginx
        image: nginx:1.25.0
        ports:
        - containerPort: 80
